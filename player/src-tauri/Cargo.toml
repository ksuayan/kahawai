[package]
name = "kahawai-player"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.85"

# Excluded from the workspace (root Cargo.toml) because this Linux VM has
# no GTK/WebKit dev packages; the shell is built on macOS.

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Mobile (Android/iOS) builds the Rust core as a cdylib loaded via JNI.
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# `devtools`: the Web Inspector in release builds too, but only when the
# user turns on Settings > Developer tools (off by default; see
# DeveloperConfig in main.rs). It uses a private macOS API, so a Mac App
# Store build would have to drop it.
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
kahawai-core = { path = "../../crates/kahawai-core" }
kahawai-player-core = { path = "../../crates/kahawai-player-core" }
kahawai-player-api = { path = "../../crates/kahawai-player-api" }
kahawai-player-audio = { path = "../../crates/kahawai-player-audio" }
fs4 = "1.1.0"
# Logging: the engine (kahawai-player-core) logs through `tracing`; the
# subscriber writes it out, and logfile.rs points output at a log file when
# the app is opened from Finder (dup2).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
log = "0.4"

# Android only: logcat backend for dev-build tracing (see logging.rs).
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
env_filter = { version = "0.1", default-features = false }

# The audio path optimised in dev builds too, as the root workspace does for
# kahawai-player-core (this crate is outside that workspace, so its profile
# does not reach here). Unoptimised, the DSP and decoders run several times
# slower: on the HiBy R4 the analog stage alone took 183% of real time and
# the load meter read nothing like a release build. Debug info stays on.
[profile.dev.package.kahawai-player-core]
opt-level = 2
[profile.dev.package.kahawai-player-audio]
opt-level = 2
[profile.dev.package.symphonia-core]
opt-level = 2
[profile.dev.package.symphonia-bundle-flac]
opt-level = 2
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 2
[profile.dev.package.symphonia-codec-aac]
opt-level = 2
[profile.dev.package.symphonia-codec-alac]
opt-level = 2
[profile.dev.package.symphonia-codec-pcm]
opt-level = 2
[profile.dev.package.rustfft]
opt-level = 2
